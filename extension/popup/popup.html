<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackbox Testing Agent</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #18181b;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.12);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 3px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .version-tag {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface-elevated);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .settings-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .settings-panel.active {
      display: block;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 54px;
    }

    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .mode-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(59, 130, 246, 0.4);
    }

    .primary-btn {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .primary-btn:hover {
      background: var(--accent-hover);
    }

    .primary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 14px;
    }

    .status-card.active {
      display: block;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pill-running {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .pill-completed {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .pill-stopped, .pill-failed {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .stat-val {
      font-weight: 600;
      color: var(--text);
    }

    .action-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .btn-secondary {
      flex: 1;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-secondary:hover {
      border-color: var(--border-hover);
    }

    .btn-danger {
      background: var(--danger-soft);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 16px 0 8px 0;
    }

    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s;
    }

    .recent-item:hover {
      border-color: var(--border-hover);
    }

    .recent-url {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-meta {
      font-size: 10px;
      color: var(--text-muted);
    }

    .error-msg {
      font-size: 11px;
      color: var(--danger);
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo"></div>
      <span class="brand-title">BLACKBOX</span>
      <span class="version-tag">MV3</span>
    </div>
    <button id="toggleSettingsBtn" class="icon-btn">Config</button>
  </div>

  <div id="settingsPanel" class="settings-panel">
    <div class="field">
      <label>Backend API URL</label>
      <input type="text" id="backendUrlInput" value="http://localhost:8000" />
    </div>
    <div class="field">
      <label>X-API-Key</label>
      <input type="password" id="apiKeyInput" placeholder="bb_..." />
    </div>
    <button id="saveSettingsBtn" class="primary-btn" style="padding: 6px;">Save Configuration</button>
  </div>

  <form id="launchForm">
    <div class="field">
      <label>Target Web URL</label>
      <input type="text" id="targetUrlInput" required placeholder="https://..." />
    </div>

    <div class="field">
      <label>Audit Scope</label>
      <div class="mode-selector">
        <button type="button" id="modeFocused" class="mode-btn active">Focused Flow</button>
        <button type="button" id="modeFullSite" class="mode-btn">Full Site Crawl</button>
      </div>
    </div>

    <div class="field">
      <label>Model Engine</label>
      <select id="modelSelect">
        <option value="qwen3.6:35b">qwen3.6:35b (21.1GB) - Recommended</option>
        <option value="qwen2.5:7b">qwen2.5:7b (4.4GB) - Fast</option>
      </select>
    </div>

    <div class="field" id="goalField">
      <label>Testing Goal</label>
      <textarea id="goalInput" placeholder="e.g. Search for athletic shoes and add to cart"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="primary-btn">Start Autonomous Audit</button>
    <div id="errorBox" class="error-msg"></div>
  </form>

  <div id="statusCard" class="status-card">
    <div class="status-header">
      <span style="font-weight: 600; font-size: 12px;">Active Test Session</span>
      <span id="runStatusPill" class="status-pill pill-running">RUNNING</span>
    </div>
    <div class="stat-row">
      <span>Mode:</span>
      <span id="statMode" class="stat-val">FOCUSED</span>
    </div>
    <div class="stat-row">
      <span>Steps Executed:</span>
      <span id="statSteps" class="stat-val">0</span>
    </div>
    <div class="stat-row">
      <span>Friction Score:</span>
      <span id="statScore" class="stat-val">100.0</span>
    </div>
    <div class="action-row">
      <a id="viewReportLink" class="btn-secondary" target="_blank">Open Dashboard Report</a>
      <button id="stopRunBtn" class="btn-danger">Stop</button>
    </div>
  </div>

  <div class="section-title">Recent Audits</div>
  <div id="recentList">
    <div style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 8px;">Loading runs...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
